name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        run: cargo tauri build --bundles msi

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          Copy-Item src-tauri\target\release\memssuite.exe dist\windows\
          Copy-Item -Recurse -Force src-tauri\target\release\bundle\msi dist\windows\
          Compress-Archive -Path dist\windows\memssuite.exe, dist\windows\msi -DestinationPath dist\memssuite-windows-${{ github.ref_name }}.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\memssuite-windows-${{ github.ref_name }}.zip" `
            --title "${{ github.ref_name }}" `
            --generate-notes
